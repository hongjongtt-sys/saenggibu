<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>생기부 작성기</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--line:#dde2e8;--text:#1f2933;--muted:#6b7785;--pri:#2f5bea;--pri-soft:#e9effd;--ok:#16794a;--ok-soft:#e5f5ec;--warn:#a86a00;--warn-soft:#fff3d6;--bad:#cf2a3c;--bad-soft:#fde8ea}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.topbar{display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;margin-right:6px}
.fileinfo{color:var(--muted);font-size:13px}
.auto{color:var(--muted);font-size:12px;margin-left:8px}
.recent{margin:-6px 0 14px}
.recent button{padding:9px 16px;font-size:14px;border-color:var(--pri);color:var(--pri)}
.dirty{color:var(--bad);font-weight:700;margin-left:4px}
.spacer{flex:1}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--text);white-space:nowrap}
button:hover{background:#eef1f5}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{filter:brightness(1.07)}
button.sm{padding:2px 7px;font-size:12px}
button:disabled{opacity:.35;cursor:default}
button.danger{color:var(--bad)}
button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.tabs{display:flex;gap:2px;padding:0 8px;overflow-x:auto}
.tab{border:none;border-bottom:3px solid transparent;border-radius:0;padding:9px 14px;background:none}
.tab:hover{background:#f5f7fa}
.tab.on{border-bottom-color:var(--pri);color:var(--pri);font-weight:700}
main{max-width:980px;margin:0 auto;padding:14px 14px 80px}
h2{font-size:16px;margin:0}
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.hint{color:var(--muted);font-size:13px;margin:4px 0 10px;line-height:1.6}
.muted{color:var(--muted);font-size:13px}
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:10px}
.guide{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:8px;padding:10px 14px;margin-bottom:18px;line-height:1.75;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;scroll-margin-top:110px}
.card-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8f9fb;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:10px 12px}
.stu{font-weight:800;font-size:15px}
.title-in{font:inherit;font-weight:700;border:1px solid transparent;border-radius:5px;padding:3px 6px;background:transparent;min-width:120px}
.title-in:hover,.title-in:focus{border-color:var(--line);background:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0}
input[type=text],input[type=number],input[type=password],select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#fff}
textarea{width:100%;min-height:56px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;line-height:1.65;background:#fff;overflow:hidden}
textarea:focus,input:focus,select:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.tb-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tb-row.out{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.tb-label{font-size:12px;color:var(--muted);font-weight:700;margin-right:2px}
.toolbar .grp{display:flex;gap:4px;align-items:center}
.helpbox{background:var(--pri-soft);border-radius:8px;padding:10px 14px;margin-top:8px;font-size:13px;line-height:1.75}
.helpbox ol{margin:4px 0 6px;padding-left:20px}
.helpbox .muted{font-size:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 2px 12px;font-size:13px}
.pill{padding:2px 9px;border-radius:99px;background:#eef1f5;color:var(--muted)}
.pill.bad{background:var(--bad-soft);color:var(--bad);font-weight:700}
.pill.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.act{padding:8px 12px;border-bottom:1px dashed var(--line)}
.act:last-child{border-bottom:none}
.act.checked{background:#fbfcff}
.act-h{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
.chk input{width:17px;height:17px}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--warn-soft);color:var(--warn)}
.bytes{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bytes.over{color:var(--bad);font-weight:800}
.bytes.ok{color:var(--ok)}
.badge{font-size:12px;padding:2px 8px;border-radius:5px;background:#eef1f5;color:var(--muted)}
.badge.man{background:var(--pri-soft);color:var(--pri);font-weight:700}
.badge.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.mfoot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.warnbox{background:var(--warn-soft);border-radius:6px;padding:7px 10px;margin-bottom:7px;font-size:13px;color:#6b4a00}
.warnbox details{margin-top:4px}
.warnbox pre{white-space:pre-wrap;font:inherit;background:#fff;border-radius:5px;padding:6px 8px;margin:5px 0 0}
.hope{display:flex;align-items:center;gap:6px;font-size:13px}.hope input{width:200px}
.msec{padding:4px 0 12px}.msec+.msec{border-top:1px dashed var(--line);padding-top:12px}
.msec-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}.msec-h b{font-size:14px}
.hiddenrow{padding:6px 12px;font-size:12px;color:var(--muted);background:#fafafa}
.stbl{border-collapse:collapse;width:100%;max-width:520px;margin-top:8px}
.stbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:3px 4px;border-bottom:1px solid var(--line)}
.stbl td{padding:2px 4px}
.stbl input{width:100%}
.paste{display:flex;gap:8px;align-items:stretch}
.paste textarea{min-height:80px;overflow:auto;font-size:13px}
.paste .col{display:flex;flex-direction:column;gap:5px}
.actlist{display:flex;flex-direction:column;gap:4px;margin:6px 0 8px}
.actitem{display:flex;gap:5px;align-items:center}
.actitem .num{width:22px;color:var(--muted);font-size:12px;text-align:right}
.actitem input{flex:1;max-width:380px}
.typebadge{font-size:11px;padding:2px 7px;border-radius:4px;background:#eef1f5;color:var(--muted);font-weight:600}
.links{display:flex;gap:10px;flex-wrap:wrap}
.links label{display:flex;gap:4px;align-items:center;cursor:pointer}
.welcome{max-width:520px;margin:70px auto;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px 26px}
.welcome h1{font-size:22px;margin:0 0 8px}
.welcome .btns{display:flex;gap:10px;justify-content:center;margin:22px 0 14px}
.welcome .btns button{padding:10px 18px;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.42);display:flex;align-items:center;justify-content:center;z-index:100}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:12px;padding:20px;width:min(380px,92vw)}
.mbox h3{margin:0 0 6px;font-size:16px}
.mbox input{width:100%;margin:5px 0}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choices button{text-align:left;padding:8px 12px;display:flex;flex-direction:column;gap:2px;white-space:normal}
.choices button span{font-size:12px;opacity:.8}
.clist{margin:6px 0 0;padding-left:18px;max-height:180px;overflow:auto;font-size:12px}
.mbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
#toast.show{opacity:.95}
#printArea{display:none}
#dropOverlay{position:fixed;inset:0;z-index:150;background:rgba(47,91,234,.12);border:4px dashed var(--pri);display:none;align-items:center;justify-content:center;pointer-events:none}
#dropOverlay.show{display:flex}
#dropOverlay div{background:#fff;padding:18px 28px;border-radius:12px;font-size:17px;font-weight:700;color:var(--pri);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.rdrop{border:2px dashed #b9c6f5;background:#f7f9ff;border-radius:10px;padding:12px 16px;margin-bottom:10px;cursor:pointer;transition:background .15s,border-color .15s}
.rdrop:hover,body.dragging .rdrop{background:var(--pri-soft);border-color:var(--pri)}
.rdrop-t{font-weight:700;color:var(--pri);margin-bottom:4px}
.rdrop-d{font-size:12.5px;color:var(--muted);line-height:1.7}
.dropzone{margin-top:12px;padding:16px;border:2px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
@media (max-width:640px){.paste{flex-direction:column}}
@media print{
  @page{size:A4;margin:12mm}
  header,main,#toast,.modal{display:none!important}
  body{background:#fff;font-size:11pt}
  #printArea{display:block}
  .ptitle{font-size:13pt;font-weight:800;margin-bottom:6px;padding-bottom:4px;border-bottom:2px solid #333}
  .pcard{break-inside:avoid;page-break-inside:avoid;padding:8px 0 10px;border-bottom:1.5px dashed #888;position:relative}
  .pcard::after{content:"✂";position:absolute;right:0;bottom:-9px;font-size:10pt;background:#fff;padding-left:4px;color:#666}
  .phead{display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px}
  .pact{margin:4px 0 6px;padding-left:2px}
  .pact .pn{font-weight:700}
  .pact .pt{white-space:pre-wrap;line-height:1.6;margin:2px 0 0 22px}
  .pb{font-weight:400;font-size:9pt;color:#555}
  .pmemo{border:1px solid #bbb;height:34px;margin-top:4px;border-radius:3px;font-size:8pt;color:#999;padding:2px 4px}
}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<div id="printArea"></div>
<div id="toast"></div>
<div id="dropOverlay"><div>📂 여기에 놓으면 파일을 엽니다</div></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div id="modal" class="modal hidden"><div class="mbox">
  <h3 id="mTitle"></h3>
  <p id="mDesc" class="hint"></p>
  <input type="password" id="mPw1" placeholder="비밀번호">
  <input type="password" id="mPw2" placeholder="비밀번호 확인">
  <div class="mbtns">
    <button id="mClear" class="danger">비밀번호 해제</button>
    <span class="spacer"></span>
    <button id="mCancel">취소</button>
    <button id="mOk" class="pri">확인</button>
  </div>
</div></div>

</script>
<script>
/* ================= 기본 유틸 ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TE=new TextEncoder(), TD=new TextDecoder();
const fmt=n=>n.toLocaleString('ko-KR');

/* 나이스 바이트: 한글 3, 영문·숫자·공백 1, 줄바꿈(엔터) 2 */
function nb(s){
  if(!s) return 0;
  s=String(s).replace(/\r\n?/g,'\n');
  const nl=(s.match(/\n/g)||[]).length;
  return TE.encode(s).length+nl;
}

let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ================= 상태 ================= */
let DB=null;            // 현재 연도 파일 데이터
let UI={tab:'settings',cls:{},view:{},filter:{}};
let OPEN={};            // 설정 화면 펼침 상태
let fileHandle=null, fileName='', password=null, dirty=false;
const FSA=!!window.showSaveFilePicker;
let RECENT=null;            // {handle,name} — 파일 위치만 기억, 내용은 저장 안 함
let AUTOSAVE=true, lastSaved=null, needPerm=false, saving=false;
try{AUTOSAVE=localStorage.getItem('sgb_autosave')!=='0';}catch{}

/* 최근 파일 위치 기억 (IndexedDB, 내용 없이 파일 핸들만) */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('sgb-writer',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function kvGet(k){try{const db=await idb();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);});}catch{return undefined;}}
async function kvSet(k,v){try{const db=await idb();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=res;});}catch{}}
async function kvDel(k){try{const db=await idb();await new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=res;t.onerror=res;});}catch{}}
async function rememberHandle(h){if(!h)return;RECENT={handle:h,name:h.name};await kvSet('recent',RECENT);}
async function forgetRecent(){await kvDel('recent');RECENT=null;render();toast('최근 파일 기억을 지웠습니다');}
async function reopenRecent(){
  if(!RECENT)return;
  const h=RECENT.handle;
  try{
    let p=await h.queryPermission({mode:'read'});
    if(p!=='granted') p=await h.requestPermission({mode:'read'});
    if(p!=='granted'){toast('파일 접근이 허용되지 않았습니다');return;}
    const f=await h.getFile();
    if(await loadText(await f.text(),f.name)){fileHandle=h;await checkPerm();}
  }catch(e){alert('최근 파일을 찾을 수 없습니다.\nUSB가 꽂혀 있는지 확인하거나 [파일 열기]로 직접 골라 주세요.');}
}

/* 자동 저장 */
async function checkPerm(){
  try{needPerm=fileHandle?(await fileHandle.queryPermission({mode:'readwrite'}))!=='granted':false;}catch{needPerm=true;}
  updAuto();
}
async function grantPerm(){
  if(!fileHandle)return;
  try{needPerm=(await fileHandle.requestPermission({mode:'readwrite'}))!=='granted';}catch{needPerm=true;}
  updAuto();
  if(!needPerm){toast('자동 저장을 시작합니다');if(dirty)saveFile(false,true);}
}
function setAutosave(on){AUTOSAVE=on;try{localStorage.setItem('sgb_autosave',on?'1':'0');}catch{}updAuto();toast(on?'자동 저장을 켰습니다':'자동 저장을 껐습니다');}
function updAuto(){
  const el=$('#autoMark');if(!el)return;
  let t='';
  if(!FSA) t='';
  else if(!AUTOSAVE) t='자동 저장 꺼짐';
  else if(!fileHandle) t='자동 저장: 처음 한 번 저장하면 시작';
  else if(needPerm){el.innerHTML=`자동 저장 대기 · <a href="#" onclick="grantPerm();return false">덮어쓰기 허용하기</a> (또는 Ctrl+S)`;return;}
  else t='자동 저장 켜짐'+(lastSaved?` · ${lastSaved.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 저장`:'');
  el.textContent=t;
}
async function autoSaveTick(){
  if(!AUTOSAVE||!DB||!dirty||!fileHandle||saving) return;
  if(!$('#modal').classList.contains('hidden')) return;
  try{
    if(await fileHandle.queryPermission({mode:'readwrite'})!=='granted'){needPerm=true;updAuto();return;}
  }catch{return;}
  needPerm=false;
  await saveFile(false,true);
}
setInterval(autoSaveTick,180000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoSaveTick();});

function newDB(year, copyFrom){
  const db={app:'saenggibu-writer',ver:1,year:year,rosters:[],areas:[],data:{}};
  if(copyFrom){
    db.rosters=JSON.parse(JSON.stringify(copyFrom.rosters));
    db.areas=JSON.parse(JSON.stringify(copyFrom.areas));
  }else{
    db.areas=[
      {id:uid(),type:'activity',name:'자율',rosterIds:[],acts:[],limit:1500,inFinal:true},
      {id:uid(),type:'activity',name:'동아리',rosterIds:[],acts:[],limit:1500},
      {id:uid(),type:'activity',name:'진로',rosterIds:[],acts:[],limit:1500,inFinal:true,hope:true},
      {id:uid(),type:'single',name:'행발',rosterIds:[],acts:[],limit:1500}
    ];
  }
  return db;
}
const area=id=>DB.areas.find(a=>a.id===id);
const roster=id=>DB.rosters.find(r=>r.id===id);
const sortedStudents=r=>[...r.students].sort((a,b)=>String(a.hakbun).localeCompare(String(b.hakbun),undefined,{numeric:true}));
function sd(aid,sid){
  DB.data[aid]??={};
  const d=DB.data[aid][sid]??={acts:{},extra:[],hidden:[],merged:null,text:''};
  d.acts??={};d.extra??=[];d.hidden??=[];
  return d;
}
function actsFor(a,d){
  const list=[...a.acts.filter(x=>!d.hidden.includes(x.id)), ...d.extra.map(x=>({...x,extra:true}))];
  if(!d.order||!d.order.length) return list;
  // 학생별 순서: 저장된 순서대로, 순서에 없는 활동(새로 추가된 것)은 원래 자리 기준으로 뒤에
  const pos=new Map(d.order.map((id,i)=>[id,i]));
  return list.map((x,i)=>({x,k:pos.has(x.id)?pos.get(x.id):1e6+i})).sort((p,q)=>p.k-q.k).map(o=>o.x);
}
function moveStuAct(aid,sid,xid,dir){
  const a=area(aid), d=sd(aid,sid), ids=actsFor(a,d).map(x=>x.id);
  const i=ids.indexOf(xid), j=i+dir; if(i<0||j<0||j>=ids.length) return;
  [ids[i],ids[j]]=[ids[j],ids[i]]; d.order=ids; touch(); render();
}
function resetOrder(aid,sid){delete sd(aid,sid).order;touch();render();}
function autoText(a,d){
  return actsFor(a,d).map(x=>d.acts[x.id]).filter(v=>v&&v.checked&&v.text&&v.text.trim()).map(v=>v.text.trim()).join('\n');
}
function mergedState(a,d){
  const auto=autoText(a,d), m=d.merged;
  if(!m||!m.manual) return {text:auto,manual:false,warn:false,auto};
  return {text:m.text,manual:true,warn:m.base!==auto,auto};
}
const finalAreas=()=>DB.areas.filter(a=>(a.type==='activity'||a.type==='single')&&a.inFinal);
const finalText=(a,d)=>a.type==='single'?(d.text||''):mergedState(a,d).text;
const finalStatus=(a,d)=>{if(a.type==='single')return '직접 작성';const ms=mergedState(a,d);return ms.warn?'원본 변경됨':ms.manual?'수정됨':'자동';};
function finalRoster(){for(const a of finalAreas()){const r=a.rosterIds.map(roster).find(Boolean);if(r)return r;}return null;}
function migrate(db){for(const a of db.areas){if(a.type==='activity'&&a.inFinal===undefined)a.inFinal=(a.name==='자율'||a.name==='진로');if(a.type==='activity'&&a.hope===undefined)a.hope=/진로/.test(a.name);}}
/* 희망분야: 진로 특기사항과 합쳐서 영역 한도(예: 1500B) 안에 들어가야 함 → 바이트 합계에 항상 포함 */
const hopeB=(a,sid)=>a.hope?nb(sd(a.id,sid).hope||''):0;
function hopeInput(a,s){
  const v=sd(a.id,s.id).hope||'';
  return `<label class="hope">희망분야 <input type="text" value="${esc(v)}" placeholder="예) 데이터 과학자" data-a="${a.id}" data-s="${s.id}" oninput="onHopeInput(this)"><span class="bytes" id="hb_${a.id}_${s.id}">${fmt(nb(v))}B</span></label>`;
}
function onHopeInput(t){
  const a=area(t.dataset.a), sid=t.dataset.s, v=t.value;sd(a.id,sid).hope=v;
  const el=$(`#hb_${a.id}_${sid}`); if(el) el.textContent=`${fmt(nb(v))}B`;
  updateSum(a,sid);
  const mf=$(`#mf_${a.id}_${sid}`); if(mf) mf.innerHTML=mergeFoot(a,sid,mergedState(a,sd(a.id,sid)));
  touch();
}
function touch(){dirty=true;const m=$('#dirtyMark');if(m)m.textContent='● 저장 안 됨';}
function clean(){dirty=false;const m=$('#dirtyMark');if(m)m.textContent='';}

/* ================= 렌더링 ================= */
function render(){
  renderHeader();
  if(!DB){renderWelcome();return;}
  if(UI.tab==='settings') renderSettings();
  else if(UI.tab==='final'){if(finalAreas().length)renderFinal();else{UI.tab='settings';return render();}}
  else{const a=area(UI.tab); if(!a){UI.tab='settings';return render();} renderArea(a);}
  document.querySelectorAll('main textarea.grow').forEach(grow);
}
function go(tab){UI.tab=tab;render();window.scrollTo(0,0);}

function toggleOpen(k){OPEN[k]=!OPEN[k];render();}

/* ---------- 명단 조작 ---------- */
function parseRoster(txt){
  const out=[];
  for(const line of txt.split(/\r?\n/)){
    const parts=line.trim().split(/\t|,|\s+/).filter(Boolean);
    if(parts.length<2||!/^\d+$/.test(parts[0])) continue;   // 머리글 줄 등은 건너뜀
    out.push({hakbun:parts[0],name:parts.slice(1).join(' ')});
  }
  return out;
}
function addRoster(){
  const name=prompt('명단 이름을 입력하세요 (예: 2-3, 2-1, 수학탐구반)');
  if(!name||!name.trim())return;
  const r={id:uid(),name:name.trim(),students:[]};
  DB.rosters.push(r);OPEN['r'+r.id]=true;touch();render();
}
function renameRoster(id,v){if(v.trim())roster(id).name=v.trim();touch();render();}
function purgeStudent(sid){for(const aid in DB.data) delete DB.data[aid][sid];}
function delRoster(id){
  const r=roster(id), used=DB.areas.filter(a=>a.rosterIds.includes(id));
  if(!confirm(`'${r.name}' 명단을 삭제할까요?${used.length?'\n연결된 영역: '+used.map(a=>a.name).join(', '):''}\n이 명단 학생들의 작성 내용도 함께 삭제됩니다.`))return;
  r.students.forEach(s=>purgeStudent(s.id));
  DB.rosters=DB.rosters.filter(x=>x!==r);
  DB.areas.forEach(a=>a.rosterIds=a.rosterIds.filter(x=>x!==id));
  touch();render();
}
function pasteRoster(id,replace){
  const r=roster(id), ta=$('#paste_'+id), list=parseRoster(ta.value);
  if(!list.length){alert('인식된 학생이 없습니다.\n한 줄에 학번(숫자)과 이름이 함께 있어야 합니다.');return;}
  if(replace){
    const keep=new Set(list.map(x=>x.hakbun));
    const removed=r.students.filter(s=>!keep.has(String(s.hakbun)));
    if(removed.length&&!confirm(`새 명단에 없는 ${removed.length}명(${removed.slice(0,5).map(s=>s.name).join(', ')}${removed.length>5?' 등':''})이 삭제되고 작성 내용도 지워집니다. 계속할까요?`))return;
    removed.forEach(s=>purgeStudent(s.id));
    r.students=r.students.filter(s=>keep.has(String(s.hakbun)));
  }
  let add=0,upd=0;
  for(const x of list){
    const ex=r.students.find(s=>String(s.hakbun)===x.hakbun);
    if(ex){if(ex.name!==x.name){ex.name=x.name;upd++;}}
    else{r.students.push({id:uid(),hakbun:x.hakbun,name:x.name});add++;}
  }
  ta.value='';touch();render();toast(`추가 ${add}명 · 이름 갱신 ${upd}명`);
}
function editStu(rid,sid,f,v){
  const r=roster(rid), s=r.students.find(x=>x.id===sid); v=v.trim();
  if(f==='hakbun'){
    if(!/^\d+$/.test(v)){alert('학번은 숫자만 입력하세요.');render();return;}
    if(r.students.some(x=>x.id!==sid&&String(x.hakbun)===v)){alert('같은 학번이 이미 있습니다.');render();return;}
  }
  s[f]=v;touch();render();
}
function delStu(rid,sid){
  const r=roster(rid), s=r.students.find(x=>x.id===sid);
  if(!confirm(`${s.hakbun} ${s.name} 학생을 삭제할까요? 작성 내용도 지워집니다.`))return;
  r.students=r.students.filter(x=>x!==s);purgeStudent(sid);touch();render();
}
function addStu(rid){
  const v=prompt('학번과 이름을 입력하세요 (예: 20315 홍길동)');if(!v)return;
  const p=parseRoster(v);if(!p.length){alert('형식: 학번 이름');return;}
  const r=roster(rid);
  if(r.students.some(x=>String(x.hakbun)===p[0].hakbun)){alert('같은 학번이 이미 있습니다.');return;}
  r.students.push({id:uid(),...p[0]});touch();render();
}

/* ---------- 영역 조작 ---------- */
function addArea(type){
  const q={subject:'과목 이름 (예: 확률과 통계)',activity:'영역 이름 (예: 봉사)',single:'영역 이름'}[type];
  const name=prompt(q);if(!name||!name.trim())return;
  const a={id:uid(),type,name:name.trim(),rosterIds:[],acts:[],limit:1500};
  DB.areas.push(a);OPEN['a'+a.id]=true;touch();render();
}
function setArea(id,f,v){
  const a=area(id);
  if(f==='limit'){const n=parseInt(v,10);if(n>0)a.limit=n;}
  else if(v.trim()) a[f]=v.trim();
  touch();render();
}
function moveArea(id,d){
  const i=DB.areas.findIndex(a=>a.id===id), j=i+d;if(j<0||j>=DB.areas.length)return;
  [DB.areas[i],DB.areas[j]]=[DB.areas[j],DB.areas[i]];touch();render();
}
function delArea(id){
  const a=area(id);
  if(!confirm(`'${a.name}' 영역을 삭제할까요? 이 영역의 작성 내용이 모두 지워집니다.`))return;
  DB.areas=DB.areas.filter(x=>x!==a);delete DB.data[id];touch();render();
}
function linkRoster(aid,rid,on){
  const a=area(aid);
  a.rosterIds=on?[...new Set([...a.rosterIds,rid])]:a.rosterIds.filter(x=>x!==rid);
  touch();render();
}
function setRosterOne(aid,rid){
  const a=area(aid);
  if(a.rosterIds[0]&&a.rosterIds[0]!==rid&&!confirm('명단을 바꾸면 기존 명단 학생의 작성 내용은 화면에 나오지 않습니다(파일에는 남아 있음). 바꿀까요?')){render();return;}
  a.rosterIds=rid?[rid]:[];touch();render();
}
function addActs(aid){
  const a=area(aid), ta=$('#acts_'+aid);
  const names=ta.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!names.length)return;
  names.forEach(n=>a.acts.push({id:uid(),name:n}));
  ta.value='';touch();render();
}
function renameAct(aid,xid,v){if(!v.trim())return render();area(aid).acts.find(x=>x.id===xid).name=v.trim();touch();render();}
function moveAct(aid,xid,d){
  const L=area(aid).acts, i=L.findIndex(x=>x.id===xid), j=i+d;if(j<0||j>=L.length)return;
  [L[i],L[j]]=[L[j],L[i]];touch();render();
}
function delAct(aid,xid){
  const a=area(aid), x=a.acts.find(v=>v.id===xid);
  if(!confirm(`'${x.name}' 활동을 삭제할까요?\n모든 학생의 이 활동 내용도 함께 지워집니다.`))return;
  a.acts=a.acts.filter(v=>v!==x);
  for(const sid in (DB.data[aid]||{})){const d=DB.data[aid][sid];delete d.acts[xid];d.hidden=(d.hidden||[]).filter(h=>h!==xid);}
  touch();render();
}

/* ---------- 작성 화면 ---------- */
function curRoster(a){
  const rids=a.rosterIds.filter(id=>roster(id));
  if(!rids.length) return null;
  let rid=rids[0];
  if(a.type==='subject'&&rids.includes(UI.cls[a.id])) rid=UI.cls[a.id];
  UI.cls[a.id]=rid;
  return roster(rid);
}
function renderArea(a){
  const r=curRoster(a);
  if(!r){
    $('#main').innerHTML=`<div class="empty">'${esc(a.name)}'에 연결된 명단이 없습니다.<br><br><button class="pri" onclick="OPEN['a${a.id}']=true;go('settings')">설정에서 명단 연결하기</button></div>`;
    return;
  }
  const studs=sortedStudents(r);
  const view=a.type==='single'?'single':(a.inFinal?'act':(UI.view[a.id]||'act'));
  let filter=UI.filter[a.id]||'all';
  if(filter!=='all'&&!a.acts.some(x=>x.id===filter)) filter=UI.filter[a.id]='all';

  /* 툴바 */
  let h=`<div class="toolbar"><div class="tb-row">`;
  if(a.type==='subject'){
    const rids=a.rosterIds.filter(id=>roster(id));
    h+=`<div class="grp">${rids.map(id=>`<button class="${id===r.id?'on':''}" onclick="UI.cls['${a.id}']='${id}';render()">${esc(roster(id).name)}</button>`).join('')}</div><span class="muted">|</span>`;
  }else h+=`<span class="muted">명단: <b>${esc(r.name)}</b></span><span class="muted">|</span>`;
  if(view!=='single'){
    if(a.inFinal) h+=`<button onclick="go('final')">📋 병합은 최종 탭에서 →</button>`;
    else h+=`<div class="grp"><button class="${view==='act'?'on':''}" onclick="setView('${a.id}','act')">✏️ 활동 입력</button><button class="${view==='merge'?'on':''}" onclick="setView('${a.id}','merge')">📋 병합</button></div>`;
    if(view==='act') h+=`<select onchange="UI.filter['${a.id}']=this.value;render()"><option value="all">활동 전체 보기</option>${a.acts.map(x=>`<option value="${x.id}" ${filter===x.id?'selected':''}>${esc(x.name)}만 보기</option>`).join('')}</select>`;
  }
  h+=`<select onchange="jump(this.value);this.selectedIndex=0"><option value="">학생 바로가기…</option>${studs.map(s=>`<option value="${s.id}">${esc(s.hakbun)} ${esc(s.name)}</option>`).join('')}</select>`;
  h+=`</div>${outRow()}</div>`;

  /* 통계 */
  let over=0,man=0,warn=0,empty=0;
  for(const s of studs){
    const d=sd(a.id,s.id);
    if(a.type==='single'){const b=nb(d.text);if(b>a.limit)over++;if(!d.text.trim())empty++;continue;}
    const ms=mergedState(a,d);if(nb(ms.text)+hopeB(a,s.id)>a.limit)over++;if(ms.manual)man++;if(ms.warn)warn++;if(!ms.text.trim())empty++;
  }
  h+=`<div class="stats"><span class="pill">${studs.length}명 · 한도 ${fmt(a.limit)}B</span>`;
  h+=over?`<span class="pill bad">${view==='act'?'체크 합계 ':''}한도 초과 ${over}명</span>`:`<span class="pill ok">한도 초과 없음</span>`;
  if(man) h+=`<span class="pill">✏️ 병합 수정 ${man}명</span>`;
  if(warn) h+=`<span class="pill warn">⚠️ 원본 변경됨 ${warn}명</span>`;
  if(empty) h+=`<span class="pill">미작성 ${empty}명</span>`;
  h+=`</div>`;

  if(view==='act'&&!a.acts.length) h+=`<div class="hint">공통 활동이 없습니다. <a href="#" onclick="OPEN['a${a.id}']=true;go('settings');return false">설정에서 활동 추가</a> 또는 학생별 [+ 개별 활동]을 쓰세요.</div>`;
  if(!studs.length) h+=`<div class="empty">명단에 학생이 없습니다.</div>`;
  for(const s of studs){
    if(view==='act') h+=actCard(a,s,filter);
    else if(view==='merge') h+=mergeCard(a,s);
    else h+=singleCard(a,s);
  }
  $('#main').innerHTML=h;
}
function outRow(){
  const open=!!UI.neisHelp;
  return `<div class="tb-row out"><span class="tb-label">내보내기</span>
    <button onclick="doPrint()">🖨️ 인쇄</button>
    <button onclick="exportCSV()">⬇ 엑셀(CSV)</button>
    <span class="muted">|</span>
    <button class="pri" onclick="neisFill()">📤 나이스 양식 채우기</button>
    <button class="${open?'on':''}" onclick="UI.neisHelp=!UI.neisHelp;render()">❔ 사용법</button>
    </div>${open?`<div class="helpbox"><b>📤 나이스 양식 채우기 사용법</b>
    <ol>
      <li>나이스 해당 메뉴(교과 세특·자율·동아리·진로·행발)에서 <b>엑셀 양식을 내려받기</b> (반별·동아리별)</li>
      <li>[📤 나이스 양식 채우기]를 누르고 <b>내려받은 파일 선택</b> — 어느 영역 양식인지 자동으로 알아냅니다</li>
      <li>다운로드 폴더에 생긴 <b>원래이름_작성.xlsx</b>를 나이스에서 업로드</li>
      <li>결과 창의 ⚠️(명단에 없는 학생, 바이트 초과)를 확인하고, 업로드 후 파일은 지우기</li>
    </ol>
    <div class="muted">· 학년·반·번호로 학생을 찾아 <b>내용 칸만</b> 채웁니다. 학생개인번호·과목코드 등 나머지 칸은 양식 그대로 둡니다.<br>
    · 들어가는 내용은 <b>최종본</b>(병합 결과 또는 직접 고친 수정본, 행발은 작성 칸)입니다. 진로는 희망분야도 함께 들어갑니다.<br>
    · 작성 내용이 없는 학생은 빈칸으로 둡니다. 전학·번호 변경이 있었다면 양식을 새로 내려받아 쓰세요.</div></div>`:''}`;
}
function setView(aid,v){UI.view[aid]=v;render();window.scrollTo(0,0);}
function jump(sid){if(!sid)return;const el=document.getElementById('c_'+sid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}

function actCard(a,s,filter){
  const d=sd(a.id,s.id);
  const list=actsFor(a,d).filter(x=>filter==='all'||x.id===filter);
  const sum=nb(autoText(a,d))+hopeB(a,s.id);
  let h=`<div class="card" id="c_${s.id}"><div class="card-h"><span class="stu">${esc(s.hakbun)} ${esc(s.name)}</span>${a.hope?hopeInput(a,s):''}<span class="spacer"></span>
    <span class="bytes ${sum>a.limit?'over':''}" id="sum_${s.id}">${a.hope?'체크+희망분야':'체크 합계'} ${fmt(sum)} / ${fmt(a.limit)}B</span>
    ${filter==='all'?`<button class="sm" onclick="addExtra('${a.id}','${s.id}')">+ 개별 활동</button>`:''}</div>`;
  if(!list.length) h+=`<div class="hiddenrow">${filter==='all'?'활동이 없습니다.':'이 학생은 이 활동을 숨겼습니다.'}</div>`;
  const canMove=filter==='all'&&list.length>1;
  list.forEach((x,idx)=>{
    const v=d.acts[x.id]||{}, b=nb(v.text||'');
    h+=`<div class="act ${v.checked?'checked':''}" id="row_${s.id}_${x.id}"><div class="act-h">
      <label class="chk"><input type="checkbox" ${v.checked?'checked':''} onchange="setChk('${a.id}','${s.id}','${x.id}',this.checked)"><b>${esc(x.name)}</b></label>
      ${x.extra?'<span class="tag">개별</span>':''}<span class="spacer"></span>
      <span class="bytes ${b>a.limit?'over':''}" id="b_${s.id}_${x.id}">${fmt(b)}B</span>
      ${canMove?`<button class="sm" title="위로" ${idx===0?'disabled':''} onclick="moveStuAct('${a.id}','${s.id}','${x.id}',-1)">▲</button><button class="sm" title="아래로" ${idx===list.length-1?'disabled':''} onclick="moveStuAct('${a.id}','${s.id}','${x.id}',1)">▼</button>`:''}
      ${x.extra?`<button class="sm" onclick="renameExtra('${a.id}','${s.id}','${x.id}')">이름</button><button class="sm danger" onclick="delExtra('${a.id}','${s.id}','${x.id}')">삭제</button>`
               :`<button class="sm" title="이 학생에게서만 숨깁니다" onclick="hideAct('${a.id}','${s.id}','${x.id}')">숨기기</button>`}
      </div><textarea class="grow" data-a="${a.id}" data-s="${s.id}" data-x="${x.id}" oninput="onActInput(this)" placeholder="${esc(x.name)} 내용 입력">${esc(v.text||'')}</textarea></div>`;
  });
  if(filter==='all'&&d.order&&d.order.length) h+=`<div class="hiddenrow">이 학생만 활동 순서를 바꿨습니다 <button class="sm" onclick="resetOrder('${a.id}','${s.id}')">기본 순서로</button></div>`;
  if(filter==='all'&&d.hidden.length){
    const names=d.hidden.map(id=>a.acts.find(x=>x.id===id)?.name).filter(Boolean);
    if(names.length) h+=`<div class="hiddenrow">숨긴 활동: ${esc(names.join(', '))} <button class="sm" onclick="unhide('${a.id}','${s.id}')">모두 복원</button></div>`;
  }
  return h+'</div>';
}
function updateSum(a,s){
  const d=sd(a.id,s), sum=nb(autoText(a,d))+hopeB(a,s), el=$('#sum_'+s);
  if(el){el.textContent=`${a.hope?'체크+희망분야':'체크 합계'} ${fmt(sum)} / ${fmt(a.limit)}B`;el.classList.toggle('over',sum>a.limit);}
}
function onActInput(t){
  const a=area(t.dataset.a), s=t.dataset.s, x=t.dataset.x, d=sd(a.id,s);
  (d.acts[x]??={text:'',checked:false}).text=t.value;
  const b=nb(t.value), el=$(`#b_${s}_${x}`);
  el.textContent=fmt(b)+'B';el.classList.toggle('over',b>a.limit);
  updateSum(a,s);grow(t);touch();
}
function setChk(aid,sid,xid,on){
  const a=area(aid), d=sd(aid,sid);
  (d.acts[xid]??={text:'',checked:false}).checked=on;
  $(`#row_${sid}_${xid}`)?.classList.toggle('checked',on);
  updateSum(a,sid);touch();
}
function addExtra(aid,sid){
  const n=prompt('이 학생에게만 추가할 활동 이름 (예: 교내 수학경시대회)');if(!n||!n.trim())return;
  sd(aid,sid).extra.push({id:uid(),name:n.trim()});touch();render();
}
function renameExtra(aid,sid,xid){
  const x=sd(aid,sid).extra.find(v=>v.id===xid), n=prompt('활동 이름',x.name);
  if(!n||!n.trim())return;x.name=n.trim();touch();render();
}
function delExtra(aid,sid,xid){
  const d=sd(aid,sid);if(!confirm('이 개별 활동과 내용을 삭제할까요?'))return;
  d.extra=d.extra.filter(v=>v.id!==xid);delete d.acts[xid];touch();render();
}
function hideAct(aid,sid,xid){const d=sd(aid,sid);if(!d.hidden.includes(xid))d.hidden.push(xid);touch();render();}
function unhide(aid,sid){sd(aid,sid).hidden=[];touch();render();}

/* 병합 */
function mergeBadge(ms){return ms.warn?'<span class="badge warn">⚠️ 원본 변경됨</span>':ms.manual?'<span class="badge man">✏️ 수정됨</span>':'<span class="badge">자동 병합</span>';}
function mergeFoot(a,s,ms){
  const b=nb(ms.text)+hopeB(a,s);
  const hb=hopeB(a,s);
  let h=`<span class="bytes ${b>a.limit?'over':'ok'}">${fmt(b)} / ${fmt(a.limit)}B${hb?` (희망분야 ${fmt(hb)}B 포함)`:''} ${b>a.limit?`· ${fmt(b-a.limit)}B 초과`:''}</span><span class="spacer"></span>`;
  if(ms.manual) h+=`<button class="sm" onclick="remerge('${a.id}','${s}')">↺ 다시 병합 (수정 버리기)</button>`;
  h+=`<button class="sm pri" onclick="copyMerged('${a.id}','${s}')">📋 복사</button>`;
  return h;
}
function mergeSection(a,s,showName){
  const d=sd(a.id,s.id), ms=mergedState(a,d), k=a.id+'_'+s.id;
  let h=`<div class="msec"><div class="msec-h">${showName?`<b>${esc(a.name)}</b>`:''}<span id="mb_${k}">${mergeBadge(ms)}</span>${a.hope?'<span class="spacer"></span>'+hopeInput(a,s):''}</div>`;
  if(ms.warn) h+=`<div class="warnbox">수정한 뒤에 활동 내용이나 체크가 바뀌었습니다. 다시 병합하면 직접 수정한 내용은 사라집니다.
    <details><summary>새 병합 결과 미리보기 (${fmt(nb(ms.auto))}B)</summary><pre>${esc(ms.auto)||'(체크된 활동 없음)'}</pre></details>
    <div class="mfoot"><button class="sm" onclick="remerge('${a.id}','${s.id}')">새 결과로 다시 병합</button><button class="sm" onclick="keepMerge('${a.id}','${s.id}')">현재 수정본 유지</button></div></div>`;
  h+=`<textarea class="grow" data-a="${a.id}" data-s="${s.id}" oninput="onMergeInput(this)" placeholder="${esc(a.name)} 활동 입력에서 체크한 활동이 여기에 합쳐집니다">${esc(ms.text)}</textarea>
    <div class="mfoot" id="mf_${k}">${mergeFoot(a,s.id,ms)}</div></div>`;
  return h;
}
function mergeCard(a,s){
  return `<div class="card" id="c_${s.id}"><div class="card-h"><span class="stu">${esc(s.hakbun)} ${esc(s.name)}</span></div><div class="card-b">${mergeSection(a,s,false)}</div></div>`;
}
function onMergeInput(t){
  const a=area(t.dataset.a), s=t.dataset.s, d=sd(a.id,s), k=a.id+'_'+s;
  if(!d.merged||!d.merged.manual) d.merged={manual:true,base:autoText(a,d),text:t.value};
  else d.merged.text=t.value;
  const ms=mergedState(a,d);
  $('#mb_'+k).innerHTML=mergeBadge(ms);$('#mf_'+k).innerHTML=mergeFoot(a,s,ms);
  grow(t);touch();
}

/* 최종 탭 (자율·진로 병합 모음) */
function renderFinal(){
  const r=finalRoster(), fa=finalAreas().filter(a=>r&&a.rosterIds.includes(r.id));
  if(!r){$('#main').innerHTML=`<div class="empty">최종 탭 영역(${esc(finalAreas().map(a=>a.name).join(', '))})에 연결된 명단이 없습니다.<br><br><button class="pri" onclick="go('settings')">설정으로</button></div>`;return;}
  const other=finalAreas().filter(a=>!fa.includes(a));
  const studs=sortedStudents(r);
  let h=`<div class="toolbar"><div class="tb-row"><span class="muted">명단: <b>${esc(r.name)}</b></span><span class="muted">|</span>
    <select onchange="jump(this.value);this.selectedIndex=0"><option value="">학생 바로가기…</option>${studs.map(s=>`<option value="${s.id}">${esc(s.hakbun)} ${esc(s.name)}</option>`).join('')}</select>
    </div>${outRow()}</div>`;
  if(other.length) h+=`<div class="warnbox">${esc(other.map(a=>a.name).join(', '))}은(는) 명단이 '${esc(r.name)}'와 달라 여기 표시되지 않습니다. 설정에서 같은 명단으로 연결하세요.</div>`;
  h+=`<div class="stats">`;
  for(const a of fa){
    let over=0,man=0,warn=0;
    for(const s of studs){const d=sd(a.id,s.id);if(nb(finalText(a,d))+hopeB(a,s.id)>a.limit)over++;if(a.type==='single')continue;const ms=mergedState(a,d);if(ms.manual)man++;if(ms.warn)warn++;}
    h+=`<span class="pill ${over?'bad':'ok'}">${esc(a.name)} 초과 ${over}명</span>`;
    if(man) h+=`<span class="pill">${esc(a.name)} ✏️수정 ${man}명</span>`;
    if(warn) h+=`<span class="pill warn">${esc(a.name)} ⚠️원본 변경 ${warn}명</span>`;
  }
  h+=`</div>`;
  if(!studs.length) h+=`<div class="empty">명단에 학생이 없습니다.</div>`;
  for(const s of studs){
    h+=`<div class="card" id="c_${s.id}"><div class="card-h"><span class="stu">${esc(s.hakbun)} ${esc(s.name)}</span></div><div class="card-b">`;
    for(const a of fa) h+=a.type==='single'?singleSection(a,s):mergeSection(a,s,true);
    h+=`</div></div>`;
  }
  $('#main').innerHTML=h;
}
function remerge(aid,sid){sd(aid,sid).merged=null;touch();render();}
function keepMerge(aid,sid){const a=area(aid),d=sd(aid,sid);d.merged.base=autoText(a,d);touch();render();}
function copyMerged(aid,sid){const a=area(aid);copyText(mergedState(a,sd(aid,sid)).text);}

/* 단일칸 (행발) */
function singleCard(a,s){
  const d=sd(a.id,s.id), b=nb(d.text);
  return `<div class="card" id="c_${s.id}"><div class="card-h"><span class="stu">${esc(s.hakbun)} ${esc(s.name)}</span></div><div class="card-b">
    <textarea class="grow" data-a="${a.id}" data-s="${s.id}" oninput="onSingleInput(this)">${esc(d.text||'')}</textarea>
    <div class="mfoot"><span class="bytes ${b>a.limit?'over':'ok'}" id="sb_${a.id}_${s.id}">${fmt(b)} / ${fmt(a.limit)}B</span><span class="spacer"></span><button class="sm pri" onclick="copyText(sd('${a.id}','${s.id}').text)">📋 복사</button></div></div></div>`;
}
function singleSection(a,s){
  const d=sd(a.id,s.id), b=nb(d.text);
  return `<div class="msec"><div class="msec-h"><b>${esc(a.name)}</b><span class="badge">직접 작성</span></div>
    <textarea class="grow" data-a="${a.id}" data-s="${s.id}" oninput="onSingleInput(this)">${esc(d.text||'')}</textarea>
    <div class="mfoot"><span class="bytes ${b>a.limit?'over':'ok'}" id="sb_${a.id}_${s.id}">${fmt(b)} / ${fmt(a.limit)}B</span><span class="spacer"></span><button class="sm pri" onclick="copyText(sd('${a.id}','${s.id}').text)">📋 복사</button></div></div>`;
}
function onSingleInput(t){
  const a=area(t.dataset.a), s=t.dataset.s;sd(a.id,s).text=t.value;
  const b=nb(t.value), el=$('#sb_'+a.id+'_'+s);
  el.textContent=`${fmt(b)} / ${fmt(a.limit)}B${b>a.limit?` (${fmt(b-a.limit)}B 초과)`:''}`;
  el.classList.toggle('over',b>a.limit);el.classList.toggle('ok',b<=a.limit);
  grow(t);touch();
}

function copyText(text){

/* ================= 나이스 엑셀 양식 채우기 =================
   나이스에서 내려받은 업로드 양식(.xlsx)을 열어 학년·반·번호로 학생을 찾고,
   내용 칸(세부능력 및 특기사항 / 특기사항 / 행동특성 및 종합의견)만 채워 새 파일로 돌려준다.
   개인번호·과목코드 등 나머지 칸과 서식은 원본 그대로 둔다. 모든 처리는 이 PC 안에서만 이루어진다. */
const XNS='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const normH=s=>String(s??'').replace(/_x000D_/g,'').replace(/\s+/g,'');
const sq=t=>String(t||'').replace(/\s+/g,'');
const CONTENT_HEADERS=['세부능력및특기사항','특기사항','행동특성및종합의견'];
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n;}
function colName(n){let s='';while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function pickFile(accept){
  return new Promise(res=>{
    const i=document.createElement('input');i.type='file';i.accept=accept;
    i.onchange=()=>res(i.files[0]||null);i.click();
  });
}
async function openXlsx(file){
  if(typeof JSZip==='undefined') throw new Error('엑셀 처리 기능을 불러오지 못했습니다.');
  let zip;
  try{zip=await JSZip.loadAsync(await file.arrayBuffer());}
  catch{throw new Error('xlsx 파일을 열 수 없습니다. 나이스에서 받은 .xlsx 파일인지 확인해 주세요.\n(.xls 파일이면 엑셀에서 열어 .xlsx로 다시 저장해 주세요)');}
  const P=new DOMParser();
  const rd=async p=>{const f=zip.file(p);return f?P.parseFromString(await f.async('string'),'application/xml'):null;};
  const wb=await rd('xl/workbook.xml'); if(!wb) throw new Error('엑셀 파일 구조를 읽을 수 없습니다.');
  const sheetEl=wb.getElementsByTagNameNS(XNS,'sheet')[0];
  const rid=sheetEl.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')||sheetEl.getAttribute('r:id');
  const rels=await rd('xl/_rels/workbook.xml.rels');
  let target='worksheets/sheet1.xml';
  for(const r of rels.getElementsByTagName('Relationship')) if(r.getAttribute('Id')===rid) target=r.getAttribute('Target');
  const sheetPath=target.startsWith('/')?target.slice(1):('xl/'+target.replace(/^\.\//,''));
  const sheet=await rd(sheetPath); if(!sheet) throw new Error('시트를 찾을 수 없습니다.');
  const sstPath='xl/sharedStrings.xml';
  const sst=await rd(sstPath);
  const strings=sst?[...sst.getElementsByTagNameNS(XNS,'si')].map(si=>[...si.getElementsByTagNameNS(XNS,'t')].map(t=>t.textContent).join('')):[];
  const cellVal=c=>{
    if(!c) return '';
    const t=c.getAttribute('t'), v=c.getElementsByTagNameNS(XNS,'v')[0];
    if(t==='s') return v?(strings[+v.textContent]??''):'';
    if(t==='inlineStr') return [...c.getElementsByTagNameNS(XNS,'t')].map(x=>x.textContent).join('');
    return v?v.textContent:'';
  };
  const rows=[...sheet.getElementsByTagNameNS(XNS,'row')].map(rEl=>{
    const cells={};
    for(const c of rEl.getElementsByTagNameNS(XNS,'c')) cells[colIdx(c.getAttribute('r'))]=c;
    return {el:rEl,num:+rEl.getAttribute('r'),cells};
  });
  if(!rows.length) throw new Error('양식에 내용이 없습니다.');
  // 머리글 줄 찾기: 업로드 양식은 1행, 출석부 엑셀은 제목 아래(6행·9행 등)에 있음
  const hdrText=r=>Object.keys(r.cells).map(k=>normH(cellVal(r.cells[k])));
  let hi=rows.findIndex(r=>{const t=hdrText(r);return (t.includes('반/번호')||(t.includes('반')&&t.includes('번호')))&&(t.includes('성명')||t.includes('학년'));});
  if(hi<0) hi=0;
  const header={};
  for(const k of Object.keys(rows[hi].cells).map(Number).sort((a,b)=>a-b)){const h=normH(cellVal(rows[hi].cells[k]));if(h&&!(h in header))header[h]=k;}
  // 제목(동아리 부서명, 교과명) — 안내용
  let title='',titleKind='';
  for(const r of rows.slice(0,hi)){
    const t=Object.keys(r.cells).map(Number).sort((a,b)=>a-b).map(k=>String(cellVal(r.cells[k])||'').trim()).filter(Boolean);
    const i=t.findIndex(x=>/^부서명/.test(x));
    if(i>=0){title=(t[i].replace(/^부서명\s*:?\s*/,'')||t[i+1]||'').trim();titleKind='club';break;}
    const c=t.find(x=>/^교과\s*:/.test(x)); if(c){title=c.replace(/^교과\s*:\s*/,'').trim();titleKind='subject';break;}
  }
  return {zip,sheet,sheetPath,sst,sstPath,strings,rows,data:rows.slice(hi+1),header,cellVal,title,titleKind,sheetName:sheetEl.getAttribute('name')||''};
}
/* 양식 한 줄 → 학년-반-번호 열쇠 */
function rowKey(X,row){
  const g=v=>String(X.cellVal(row.cells[v])||'').trim();
  const H=X.header;
  let grade=H['학년']?g(H['학년']):'', cls='', no='';
  if(H['반/번호']){const m=/(\d+)\s*\/\s*(\d+)/.exec(g(H['반/번호']));if(m){cls=m[1];no=m[2];}}
  else{cls=H['반']?g(H['반']):'';no=H['번호']?g(H['번호']):'';}
  const num=v=>/^\d+(\.0+)?$/.test(v)?String(parseInt(v,10)):null;   // 출석부 엑셀은 숫자가 2.0처럼 저장됨
  grade=num(grade);cls=num(cls);no=num(no);
  if(!grade||!cls||!no) return null;
  return `${grade}-${cls}-${no}`;
}
function stuKey(hakbun){
  const h=String(hakbun).replace(/\D/g,'');
  if(h.length===5) return `${+h[0]}-${+h.slice(1,3)}-${+h.slice(3)}`;
  return null;
}
function detectArea(X){
  const H=X.header, r1=X.data[0];
  const val=c=>r1&&H[c]?String(X.cellVal(r1.cells[H[c]])||'').trim():'';
  const subj=val('과목'), kind=val('영역구분');
  if(subj){const a=DB.areas.find(a=>a.type==='subject'&&normH(a.name)===normH(subj));if(a)return {area:a,label:subj};return {area:null,label:subj};}
  const pick=(re,type)=>DB.areas.find(a=>(!type||a.type===type)&&re.test(a.name));
  if(/자율/.test(kind)) return {area:pick(/자율/),label:'자율'};
  if(/진로/.test(kind)) return {area:pick(/진로/),label:'진로'};
  if(/동아리/.test(kind)) return {area:pick(/동아리/),label:'동아리'};
  if(/행동특성/.test(kind)) return {area:pick(/행발|행동/,'single')||DB.areas.find(a=>a.type==='single'),label:'행발'};
  return {area:null,label:kind||X.sheetName};
}
function chooseArea(msg){
  const list=DB.areas;
  const ans=prompt(msg+'\n\n'+list.map((a,i)=>`${i+1}. ${a.name}`).join('\n')+'\n\n번호를 입력하세요');
  const n=parseInt(ans,10);return list[n-1]||null;
}
function areaText(a,sid){const d=sd(a.id,sid);return a.type==='single'?(d.text||''):mergedState(a,d).text;}
function setCellText(X,row,col,text){
  const doc=X.sheet;
  let c=row.cells[col];
  if(!c){
    c=doc.createElementNS(XNS,'c');c.setAttribute('r',colName(col)+row.num);
    const ref=X.data[0]&&X.data[0].cells[col]; if(ref&&ref.getAttribute('s')) c.setAttribute('s',ref.getAttribute('s'));
    let before=null;for(const k of Object.keys(row.cells).map(Number).sort((a,b)=>a-b)) if(k>col){before=row.cells[k];break;}
    row.el.insertBefore(c,before);row.cells[col]=c;
  }
  while(c.firstChild) c.removeChild(c.firstChild);
  if(X.sst){
    const si=X.sst.createElementNS(XNS,'si'), t=X.sst.createElementNS(XNS,'t');
    t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=text;
    si.appendChild(t);X.sst.documentElement.appendChild(si);
    const idx=X.strings.push(text)-1;
    c.setAttribute('t','s');const v=doc.createElementNS(XNS,'v');v.textContent=idx;c.appendChild(v);
  }else{
    c.setAttribute('t','inlineStr');
    const is=doc.createElementNS(XNS,'is'), t=doc.createElementNS(XNS,'t');
    t.setAttributeNS('http://www.w3.org/XML/1998/namespace','xml:space','preserve');t.textContent=text;
    is.appendChild(t);c.appendChild(is);
  }
}
async function neisFill(){
  const file=await pickFile('.xlsx');if(!file)return;
  let X;try{X=await openXlsx(file);}catch(e){alert(e.message);return;}
  const cc=CONTENT_HEADERS.map(h=>X.header[h]).find(Boolean);
  if(!cc){alert('내용 칸(세부능력 및 특기사항 / 특기사항 / 행동특성 및 종합의견)을 찾지 못했습니다.\n나이스에서 받은 업로드 양식인지 확인해 주세요.');return;}
  let {area:a,label}=detectArea(X);
  const cur=area(UI.tab);
  if(a&&cur&&cur.id!==a.id&&!confirm(`이 양식은 '${a.name}' 양식으로 보입니다.\n'${a.name}' 내용으로 채울까요?`)) a=null;
  if(!a){a=(cur&&!confirm(`양식 종류: ${label||'알 수 없음'}\n\n지금 탭('${cur.name}') 내용으로 채울까요?\n[취소]를 누르면 영역을 직접 고릅니다.`))?null:cur;if(!a)a=chooseArea(`'${label}' 양식을 어느 영역 내용으로 채울까요?`);}
  if(!a)return;
  // 학생 찾기 표
  const map={}, byName={};
  for(const rid of a.rosterIds){const r=roster(rid);if(!r)continue;for(const s of r.students){const k=stuKey(s.hakbun);if(k)map[k]=s;if(s.name)(byName[s.name]??=[]).push(s);}}
  const nameCol=X.header['성명'];
  let filled=0,emptyOurs=0,noMatch=[],over=[],nameDiff=0,hopeN=0,same=0,kept=0,appended=0,overwrote=0,hopeKept=0,contains=0;const used=new Set();
  const hopeCol=X.header['희망분야'];
  // 1단계: 줄마다 할 일 정리
  const plan=[];
  for(const row of X.data){
    const key=rowKey(X,row);
    const nm=nameCol?String(X.cellVal(row.cells[nameCol])||'').trim():'';
    let s=key?map[key]:null;
    if(!s&&nm&&byName[nm]&&byName[nm].length===1) s=byName[nm][0];
    if(!key&&!nm) continue;
    if(!s){noMatch.push(key||nm);continue;}
    used.add(s.id);
    if(nm&&s.name&&nm!==s.name) nameDiff++;
    const text=areaText(a,s.id).replace(/\r\n?/g,'\n').trim();
    const old=String(X.cellVal(row.cells[cc])||'').replace(/\r\n?/g,'\n').trim();
    const hopeV=a.hope&&hopeCol?(sd(a.id,s.id).hope||'').trim():'';
    const hopeOld=hopeCol?String(X.cellVal(row.cells[hopeCol])||'').trim():'';
    let st='write';
    if(!text) st='none';
    else if(old&&(old===text||sq(old).includes(sq(text)))) st='same';
    else if(old&&sq(text).includes(sq(old))) st='contains';   // 작성기 내용에 양식의 기존 내용이 이미 들어 있음(이전 학교 내용을 붙여넣고 이어 쓴 경우)
    else if(old) st='conflict';
    plan.push({row,s,text,old,st,hopeV,hopeOld});
  }
  // 2단계: 양식에 이미 다른 내용이 있는 학생 처리 방법 묻기
  const conflicts=plan.filter(x=>x.st==='conflict'||(x.hopeV&&x.hopeOld&&x.hopeOld!==x.hopeV));
  let mode='append';
  if(conflicts.length){
    const list=conflicts.slice(0,12).map(x=>`<li><b>${esc(x.s.hakbun)}</b> ${x.old?`양식 내용 ${fmt(nb(x.old))}B: “${esc(x.old.slice(0,40))}${x.old.length>40?'…':''}”`:''}${x.hopeOld&&x.hopeV&&x.hopeOld!==x.hopeV?` · 희망분야: ${esc(x.hopeOld)}`:''}</li>`).join('')+(conflicts.length>12?`<li>… 외 ${conflicts.length-12}명</li>`:'');
    mode=await askChoice(`양식에 이미 내용이 있는 학생 ${conflicts.length}명`,
      `나이스에서 받은 양식에 다른 선생님이나 이전 학교에서 쓴 내용이 이미 들어 있습니다. 어떻게 할까요?<ul class="clist">${list}</ul>`,
      [['append','기존 내용 뒤에 이어 붙이기 (줄바꿈)','추천 · 기존 내용 다음 줄에 작성기 내용을 붙입니다'],
       ['prepend','기존 내용 앞에 붙이기','작성기 내용 다음 줄에 기존 내용이 옵니다'],
       ['keep','기존 내용 그대로 두기','이 학생들은 채우지 않고 건너뜁니다'],
       ['overwrite','작성기 내용으로 덮어쓰기','기존 내용이 지워집니다']]);
    if(!mode) return;
  }
  // 3단계: 채우기
  for(const x of plan){
    let hopeFinal=x.hopeOld;
    if(x.hopeV){
      if(!x.hopeOld||x.hopeOld===x.hopeV||mode==='overwrite'){if(x.hopeOld!==x.hopeV)setCellText(X,x.row,hopeCol,x.hopeV);hopeN++;hopeFinal=x.hopeV;}
      else hopeKept++;
    }
    const hb=hopeCol?nb(hopeFinal):0;
    if(x.st==='none'){emptyOurs++;continue;}
    if(x.st==='same'){same++;continue;}
    if(x.st==='contains') contains++;
    let out=x.text;
    if(x.st==='conflict'){
      if(mode==='keep'){kept++;continue;}
      if(mode==='append'){out=x.old+'\n'+x.text;appended++;}
      else if(mode==='prepend'){out=x.text+'\n'+x.old;appended++;}
      else overwrote++;
    }
    setCellText(X,x.row,cc,out);filled++;
    if(nb(out)+hb>a.limit) over.push(`${x.s.hakbun}(${fmt(nb(out)+hb)}B)`);
  }
  if(!filled&&!hopeN){alert(same||kept?`새로 채울 내용이 없습니다.\n이미 같은 내용이 들어 있음 ${same}명 · 기존 내용 유지 ${kept}명`:`채울 내용이 없습니다.\n양식 학생 중 작성기 명단과 맞는 학생: ${used.size}명\n(학년·반·번호가 학번과 맞는지, '${a.name}'에 명단이 연결됐는지 확인해 주세요)`);return;}
  if(X.sst){const root=X.sst.documentElement;root.setAttribute('count',X.strings.length);root.setAttribute('uniqueCount',X.strings.length);}
  const ser=new XMLSerializer();
  X.zip.file(X.sheetPath,ser.serializeToString(X.sheet));
  if(X.sst) X.zip.file(X.sstPath,ser.serializeToString(X.sst));
  const blob=await X.zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const outName=file.name.replace(/\.xlsx$/i,'')+'_작성.xlsx';
  download(blob,outName);
  let msg=`'${a.name}' 내용으로 채웠습니다 → ${outName}\n\n✅ 채움 ${filled}명`;
  if(hopeN) msg+=`\n✅ 희망분야 ${hopeN}명`;
  if(hopeCol&&a.hope&&hopeN<used.size) msg+=`\n· 희망분야 미입력(양식 그대로) ${used.size-hopeN}명`;
  if(emptyOurs) msg+=`\n· 작성 내용 없음(빈칸 유지) ${emptyOurs}명`;
  if(appended) msg+=`\n· 기존 내용과 합침 ${appended}명 (${mode==='append'?'기존 내용 뒤에':'기존 내용 앞에'})`;
  if(kept) msg+=`\n· 기존 내용 유지(건너뜀) ${kept}명`;
  if(overwrote) msg+=`\n· 기존 내용을 덮어씀 ${overwrote}명`;
  if(same) msg+=`\n· 이미 같은 내용이 들어 있어 그대로 둠 ${same}명`;
  if(contains) msg+=`\n· 양식의 기존 내용이 작성기 내용에 포함되어 있어 작성기 내용으로 채움 ${contains}명`;
  if(hopeKept) msg+=`\n· 희망분야는 양식의 기존 값 유지 ${hopeKept}명`;
  if(noMatch.length) msg+=`\n⚠️ 작성기 명단에 없는 학생 ${noMatch.length}명: ${noMatch.slice(0,8).join(', ')}${noMatch.length>8?' …':''}`;
  if(over.length) msg+=`\n⚠️ 바이트 초과${hopeCol?'(희망분야 포함)':''} ${over.length}명: ${over.slice(0,8).join(', ')}${over.length>8?' …':''}`;
  if(nameDiff) msg+=`\n⚠️ 양식과 작성기의 이름이 다른 학생 ${nameDiff}명 (학년·반·번호 기준으로 채움)`;
  msg+=`\n\n다운로드 폴더의 파일을 나이스에서 업로드하세요. 이 파일은 암호화되지 않으니 업로드 후 지워 주세요.`;

}

/* 나이스 양식에서 명단 가져오기 */
function rosterListFromX(X){
  const nameCol=X.header['성명'], list=[], seen=new Set();
  for(const row of X.data){
    const k=rowKey(X,row);if(!k)continue;
    const [g,c,n]=k.split('-');
    const hakbun=`${g}${String(c).padStart(2,'0')}${String(n).padStart(2,'0')}`;
    if(seen.has(hakbun))continue;seen.add(hakbun);
    list.push({hakbun,name:nameCol?String(X.cellVal(row.cells[nameCol])||'').trim():''});
  }
  return list;
}
function mergeStudents(r,list){
  const inFile=new Set(list.map(x=>x.hakbun));
  const res={add:0,upd:0,noname:0,notInFile:r.students.filter(s=>!inFile.has(String(s.hakbun))).length};
  for(const x of list){
    if(!x.name)res.noname++;
    const ex=r.students.find(s=>String(s.hakbun)===x.hakbun);
    if(ex){if(x.name&&ex.name!==x.name){ex.name=x.name;res.upd++;}}
    else{r.students.push({id:uid(),hakbun:x.hakbun,name:x.name});res.add++;}
  }
  return res;
}
function mergeMsg(r,m){
  return `'${r.name}' 명단: 추가 ${m.add}명 · 이름 갱신 ${m.upd}명${m.notInFile?`\n  엑셀에 없는 기존 학생 ${m.notInFile}명은 그대로 둠(필요하면 직접 삭제)`:''}${m.noname?`\n  이름 칸이 빈 학생 ${m.noname}명은 이름 없이 들어감(직접 입력)`:''}`;
}

function classifyX(X,list,fileName){
  // 반 이름: 제목의 '2-1' 또는 학생들이 모두 같은 반이면 그 반
  const cls=new Set(list.map(x=>`${+x.hakbun[0]}-${+x.hakbun.slice(1,3)}`));
  const oneCls=cls.size===1?[...cls][0]:'';
  if(X.titleKind==='club') return {kind:'club',name:X.title||fileName,label:X.title};
  if(X.titleKind==='subject'){
    const m=/^(.*?)\s*(\d)\s*학년\s*(\d+\s*-\s*\d+)?/.exec(X.title);
    const subj=(m?m[1]:X.title).trim(), c=(m&&m[3]?m[3].replace(/\s/g,''):'')||oneCls;
    if(/자율/.test(subj)) return {kind:'home',name:c||X.title,label:X.title};
    return {kind:'subject',subject:subj,name:c||X.title,label:X.title};
  }
  return {kind:'other',name:oneCls||fileName.replace(/\.xlsx$/i,''),label:fileName};
}

async function importRosterFiles(files){
  if(!DB)return;
  files=files.filter(f=>/\.xlsx$/i.test(f.name));
  if(!files.length){alert('나이스에서 내려받은 엑셀(.xlsx) 파일을 놓아 주세요.');return;}
  const report=[];
  for(const f of files){

    const c=classifyX(X,list,f.name);
    let r=DB.rosters.find(x=>x.name===c.name), isNew=false;
    if(r&&!confirm(`[${c.label||f.name}] 학생 ${list.length}명\n\n같은 이름의 '${r.name}' 명단이 이미 있습니다.\n기존 명단에 반영할까요?\n(취소를 누르면 새 명단을 만듭니다)`)) r=null;
    if(!r){
      let nm=c.name,k=2;while(DB.rosters.some(x=>x.name===nm))nm=`${c.name} (${k++})`;
      r={id:uid(),name:nm,students:[]};DB.rosters.push(r);isNew=true;
    }
    const m=mergeStudents(r,list), notes=[];
    if(c.kind==='subject'){
      let a=DB.areas.find(x=>x.type==='subject'&&normH(x.name)===normH(c.subject));
      if(!a){a={id:uid(),type:'subject',name:c.subject,rosterIds:[],acts:[],limit:1500};DB.areas.push(a);notes.push(`'${c.subject}' 과목 영역 새로 만듦`);}
      if(!a.rosterIds.includes(r.id)){a.rosterIds.push(r.id);notes.push(`${a.name} ← 연결`);}
    }else if(c.kind==='home'){
      for(const a of DB.areas.filter(x=>(x.type==='activity'&&/자율|진로/.test(x.name))||x.type==='single')) linkSingle(a,r.id,notes);
    }else if(c.kind==='club'){
      linkSingle(DB.areas.find(x=>x.type==='activity'&&/동아리/.test(x.name)),r.id,notes);
    }
    const kindL={subject:'수업반',home:'담임반',club:'동아리',other:'명단'}[c.kind];
    report.push(`✅ [${kindL}] ${isNew?'새 명단 ':''}${mergeMsg(r,m)}${notes.length?`\n  영역: ${notes.join(' / ')}`:''}`);
  }
  touch();render();
  alert(`명단 가져오기 결과 (${files.length}개 파일)\n\n${report.join('\n\n')}\n\n과목 영역의 활동 목록은 ② 영역 관리에서 넣어 주세요.`);
}

/* ================= 암호화 ================= */
function b64e(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
function b64d(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function deriveKey(pw,salt){
  const km=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const cryptoOK=()=>!!(window.crypto&&crypto.subtle);
async function serialize(){
  const json=JSON.stringify(DB);
  if(!password) return json;
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(password,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(json)));
  return JSON.stringify({app:'saenggibu-writer',enc:'AES-GCM/PBKDF2-SHA256',year:DB.year,salt:b64e(salt),iv:b64e(iv),data:b64e(ct)});
}
async function deserialize(text){
  let o;
  try{o=JSON.parse(text);}catch{throw new Error('파일 형식이 올바르지 않습니다.');}
  if(o.app!=='saenggibu-writer') throw new Error('생기부 작성기 파일이 아닙니다.');
  if(!o.enc){password=null;return o;}
  if(!cryptoOK()) throw new Error('이 브라우저에서는 암호화 파일을 열 수 없습니다. 크롬이나 엣지를 사용하세요.');
  for(let tries=0;tries<5;tries++){
    const pw=await askPw({title:'🔒 암호화된 파일',desc:`${o.year||''}학년도 파일입니다. 비밀번호를 입력하세요.`,confirm:false});
    if(pw==null) throw new Error('cancel');
    try{
      const key=await deriveKey(pw,b64d(o.salt));
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(o.iv)},key,b64d(o.data));
      password=pw;return JSON.parse(TD.decode(pt));
    }catch{alert('비밀번호가 맞지 않습니다.');}
  }
  throw new Error('비밀번호 입력 횟수를 초과했습니다.');
}

/* 비밀번호 입력창 */
function askPw({title,desc,confirm,allowClear}){
  return new Promise(res=>{
    const m=$('#modal'),p1=$('#mPw1'),p2=$('#mPw2');
    $('#mTitle').textContent=title;$('#mDesc').textContent=desc||'';
    p1.value=p2.value='';p2.style.display=confirm?'':'none';
    $('#mClear').style.display=allowClear?'':'none';
    m.classList.remove('hidden');setTimeout(()=>p1.focus(),30);
    const done=v=>{m.classList.add('hidden');$('#mOk').onclick=$('#mCancel').onclick=$('#mClear').onclick=p1.onkeydown=p2.onkeydown=null;res(v);};
    const ok=()=>{
      if(!p1.value){alert('비밀번호를 입력하세요.');return;}
      if(confirm&&p1.value!==p2.value){alert('비밀번호 확인이 일치하지 않습니다.');return;}
      done(p1.value);
    };
    $('#mOk').onclick=ok;$('#mCancel').onclick=()=>done(null);$('#mClear').onclick=()=>done('');
    p1.onkeydown=p2.onkeydown=e=>{if(e.key==='Enter')ok();if(e.key==='Escape')done(null);};
  });
}
async function setPassword(){
  if(!cryptoOK()){alert('이 브라우저에서는 암호화를 쓸 수 없습니다. 크롬이나 엣지를 사용하세요.');return;}
  const pw=await askPw({title:password?'비밀번호 변경':'비밀번호 설정',desc:'다음 저장부터 이 비밀번호로 암호화됩니다. 잊으면 복구할 수 없습니다.',confirm:true,allowClear:!!password});
  if(pw==null)return;

}

let dragDepth=0;
const isFileDrag=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter',e=>{if(!isFileDrag(e))return;e.preventDefault();dragDepth++;
  $('#dropOverlay div').textContent=DB&&UI.tab==='settings'?'📂 나이스 엑셀(.xlsx)은 명단으로, 저장 파일(.json)은 열기':'📂 여기에 놓으면 파일을 엽니다';
  $('#dropOverlay').classList.add('show');document.body.classList.add('dragging');});

window.addEventListener('dragleave',e=>{if(!isFileDrag(e))return;dragDepth=Math.max(0,dragDepth-1);if(!dragDepth){$('#dropOverlay').classList.remove('show');document.body.classList.remove('dragging');}});
window.addEventListener('drop',async e=>{
  if(!isFileDrag(e))return;
  e.preventDefault();dragDepth=0;$('#dropOverlay').classList.remove('show');document.body.classList.remove('dragging');
  const items=[...e.dataTransfer.items].filter(i=>i.kind==='file');
  const allFiles=[...e.dataTransfer.files];
  if(allFiles.some(f=>/\.xlsx?$/i.test(f.name))){
    if(!DB){alert('먼저 새 학년도 파일을 만들거나 저장 파일(.json)을 열어 주세요.');return;}
    if(UI.tab!=='settings'){alert('명단 엑셀은 ⚙️ 설정 탭의 명단 관리에 놓아 주세요.\n(나이스 업로드 양식은 각 탭의 [📤 나이스 양식 채우기] 버튼을 쓰세요)');return;}
    if(allFiles.some(f=>/\.xls$/i.test(f.name))) alert('.xls 파일은 읽을 수 없습니다. 엑셀에서 .xlsx로 다시 저장해 주세요. (.xlsx 파일만 처리합니다)');
    importRosterFiles(allFiles);return;
  }
  if(items.length!==1){alert('파일을 하나만 끌어다 놓아 주세요.');return;}
  const item=items[0];
  const hp=item.getAsFileSystemHandle?item.getAsFileSystemHandle().catch(()=>null):Promise.resolve(null); // drop 직후에 바로 요청해야 함
  const file=item.getAsFile();
  if(!file||!/\.json$/i.test(file.name)){alert('생기부 작성기로 저장한 .json 파일만 열 수 있습니다.');return;}
  if(dirty&&!confirm('저장하지 않은 변경 사항이 있습니다. 계속할까요?'))return;
  const h=await hp;
  if(await loadText(await file.text(),file.name)){
    if(h&&h.kind==='file'){
      fileHandle=h;rememberHandle(h);await checkPerm();
    }else{fileHandle=null;updAuto();}
  }
});

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveFile(false);}
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

render();
kvGet('recent').then(r=>{if(r&&r.handle){RECENT=r;if(!DB)render();}});
</script>
</body>
</html>
